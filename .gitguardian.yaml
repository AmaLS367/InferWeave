version: 2

secret:
  # Auth class/module identifiers in the lazy-export map trigger false positives.
  # Retain the existing single-file exclusion: narrower local ggshield rules do
  # not configure the GitHub app, and occurrence fingerprints are unavailable.
  # See docs/explanation/architecture.md for the scope and supported alternatives.
  ignored-paths:
    - src/inferweave/__init__.py
