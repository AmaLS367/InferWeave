[project]
name = "inferweave"
version = "0.1.0"
description = "Unified AI inference deployment SDK across cloud GPU providers"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "httpx>=0.28.1,<1.0",
    "pydantic>=2.10.0",
    "pyyaml>=6.0.2",
    "rich>=13.0.0",
    "typer>=0.12.0",
]

[project.scripts]
inferweave = "inferweave.cli:app"

[project.optional-dependencies]
runpod = [
    "skypilot[runpod]>=0.13.0",
]
aws = [
    "skypilot[aws]>=0.13.0",
]
gcp = [
    "skypilot[gcp]>=0.13.0",
]
azure = [
    "skypilot[azure]>=0.13.0",
]
lambda = [
    "skypilot[lambda]>=0.13.0",
]
nebius = [
    "skypilot[nebius]>=0.13.0",
]
kubernetes = [
    "skypilot[kubernetes]>=0.13.0",
]
vast = [
    "skypilot[vast]>=0.13.0",
]
modal = [
    "modal>=1.3.0,<2.0",
]
clouds = [
    "skypilot[kubernetes,aws,gcp,azure,oci,nebius,lambda,runpod,fluidstack,paperspace,cudo,ibm,scp,seeweb,shadeform,vast,verda]>=0.13.0",
]
workers = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
]
all = [
    "inferweave[clouds,modal,workers]",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[tool.uv]
prerelease = "allow"
# Lockfile-only. prerelease="allow" is needed for SkyPilot's Azure SDK betas, but would also
# make uv lock dev builds of Modal and the optional [vast] SDK. Keep those on stable releases.
# Does not affect published wheel metadata (the declared extras ranges stay broad).
constraint-dependencies = ["modal==1.6.0", "vastai-sdk<1.0.0.dev0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/inferweave",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
markers = [
    "integration: marks tests as integration tests that require external services or credentials",
]



