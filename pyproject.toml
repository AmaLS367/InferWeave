[project]
name = "inferweave"
dynamic = ["version"]
description = "Unified AI inference deployment SDK across cloud GPU providers"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "AmaLS367" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.28.1,<1.0",
    "msgpack>=1.1.0,<2.0",
    "pydantic>=2.10.0",
    "pyyaml>=6.0.2",
    "rich>=13.0.0",
    "typer>=0.12.0",
]

[project.urls]
Homepage = "https://github.com/AmaLS367/InferWeave"
Repository = "https://github.com/AmaLS367/InferWeave"
Issues = "https://github.com/AmaLS367/InferWeave/issues"

[project.scripts]
inferweave = "inferweave.cli:app"

[project.optional-dependencies]
runpod = [
    "skypilot[runpod]>=0.13.0",
]
aws = [
    "skypilot[aws]>=0.13.0",
]
gcp = [
    "skypilot[gcp]>=0.13.0",
]
azure = [
    "skypilot[azure]>=0.13.0",
]
lambda = [
    "skypilot[lambda]>=0.13.0",
]
nebius = [
    "skypilot[nebius]>=0.13.0",
]
kubernetes = [
    "skypilot[kubernetes]>=0.13.0",
]
vast = [
    "skypilot[vast]>=0.13.0",
]
modal = [
    "modal>=1.6,<1.7",
]
clouds = [
    "skypilot[kubernetes,aws,gcp,azure,oci,nebius,lambda,runpod,fluidstack,paperspace,cudo,ibm,scp,seeweb,shadeform,vast,verda]>=0.13.0",
]
workers = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
]
all = [
    "inferweave[clouds,modal,workers]",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[tool.uv]
prerelease = "allow"
# Lockfile-only. prerelease="allow" is required because SkyPilot's Azure dependency chain
# (via azure-cli) strictly pins Azure SDK beta releases (e.g. azure-batch==15.0.0b1).
# To keep core, worker, and provider packages on verified stable releases, we constrain
# known sensitive dependencies.
constraint-dependencies = [
    "modal==1.6.0",
    "vastai-sdk<1.0.0.dev0",
    "lxml<6.0.0",
    "sentry-sdk<3.0.0",
    "colorful<0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/inferweave/__init__.py"

[tool.hatch.build.targets.wheel]
packages = [
    "src/inferweave",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
markers = [
    "integration: marks tests as integration tests that require external services or credentials",
]



